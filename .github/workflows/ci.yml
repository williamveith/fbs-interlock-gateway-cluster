name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify repository
        run: make verify

      - name: Smoke-test Linux AMD64 binary
        shell: bash
        run: |
          set -euo pipefail

          output="$(
            ./build/ci/fbs-interlock-gateway-cluster-linux-amd64 -version
          )"

          echo "${output}"

          grep -q \
            "fbs-interlock-gateway-cluster version=" \
            <<< "${output}"

      - name: Inspect binary formats
        shell: bash
        run: |
          set -euo pipefail

          file build/ci/fbs-interlock-gateway-cluster-linux-amd64 \
            | grep -Eq "ELF 64-bit.*x86-64"

          file build/ci/fbs-interlock-gateway-cluster-linux-arm64 \
            | grep -Eq "ELF 64-bit.*ARM aarch64"

          file build/ci/fbs-interlock-gateway-cluster-windows-amd64.exe \
            | grep -Eq "PE32\+ executable.*x86-64"

          file build/ci/fbs-interlock-gateway-cluster-darwin-arm64 \
            | grep -Eiq "Mach-O 64-bit.*(arm64|aarch64).*executable"

          file build/ci/fbs-interlock-gateway-cluster-darwin-amd64 \
            | grep -Eiq "Mach-O 64-bit.*x86_64.*executable"