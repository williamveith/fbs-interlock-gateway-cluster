<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>FBS Interlock Gateway</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="site.webmanifest">
    <link rel="icon" href="assets/favicon.svg">
</head>

<body>
    <h1>FBS Interlock Gateway</h1>

    <details class="table-section" open>
        <summary>Live Status</summary>

        <div class="table-container">
            <table id="statusTable"></table>
        </div>

        <div class="config-actions">
            <button
                id="refreshStatusButton"
                type="button"
                onclick="refreshStatus()"
            >
                Refresh Status
            </button>
        </div>
    </details>

    <details class="table-section" open>
        <summary>Config</summary>

        <details class="table-section">
            <summary>Shelly Mutual TLS</summary>

            <div class="table-container">
                <table id="tlsSettings">
                    <thead>
                        <tr>
                            <th>Setting</th>
                            <th>Gateway File Path</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Trusted Shelly server CA</td>
                            <td>
                                <input
                                    id="serverCAFile"
                                    type="text"
                                    data-tls-field="server_ca_file"
                                    autocomplete="off"
                                    spellcheck="false"
                                    placeholder="/etc/fbs-interlock-gateway-cluster/tls/server-ca.crt"
                                    aria-label="Trusted Shelly server CA file"
                                >
                            </td>
                        </tr>

                        <tr>
                            <td>Gateway client certificate</td>
                            <td>
                                <input
                                    id="clientCertFile"
                                    type="text"
                                    data-tls-field="client_cert_file"
                                    autocomplete="off"
                                    spellcheck="false"
                                    placeholder="/etc/fbs-interlock-gateway-cluster/tls/gateway-client.crt"
                                    aria-label="Gateway client certificate file"
                                >
                            </td>
                        </tr>

                        <tr>
                            <td>Gateway client private key</td>
                            <td>
                                <input
                                    id="clientKeyFile"
                                    type="text"
                                    data-tls-field="client_key_file"
                                    autocomplete="off"
                                    spellcheck="false"
                                    placeholder="/etc/fbs-interlock-gateway-cluster/tls/gateway-client.key"
                                    aria-label="Gateway client private-key file"
                                >
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </details>

        <datalist id="protocolOptions">
            <option value="http"></option>
            <option value="https"></option>
        </datalist>

        <div class="table-container">
            <table id="configTable"></table>
        </div>

        <div class="config-actions">
            <button type="button" onclick="addTool()">Add Tool</button>
            <button type="button" onclick="saveConfig()">Save Config</button>
        </div>
    </details>

    <footer>
        Created by
        <a href="https://cdn.williamveith.com/?id=af59584e-d47b-4875-86cc-81b189ab069f">
            William Veith
        </a>
    </footer>

    <script src="app.js"></script>
</body>

</html>
